aid: nervonik
name: Nervonik
description: 'Nervonik, Inc. is a clinical-stage medical device company in Los Angeles,
  California, founded in 2020 by CEO Aydin Babakhani, developing miniaturized peripheral
  nerve stimulation (PNS) neuromodulation implants for chronic neuropathic pain in
  high-motion anatomy. Its platform pairs proprietary wireless power delivery and
  miniaturized implantable leads with integrated sensing circuitry that records evoked
  compound action potentials (ECAPs) and other biomarkers, enabling closed-loop,
  patient-specific stimulation as an opioid-free alternative to spinal cord stimulators
  and pharmacological therapy. The company completed a first-in-human feasibility study
  and closed an oversubscribed $52.5M Series B in April 2026 led by Amzak Health, after a
  $13M Series A in March 2025. Nervonik publishes no developer program, public API,
  SDK, or machine-readable API contract; its public web surface is a WordPress marketing
  and investor-relations site.'
